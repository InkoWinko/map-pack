mappackversion = [echo "Map Pack Version: 3.5"]

newgui "Map Pools" [
    guilist [
        guilist [
            
        guitext "Effic CTF Map Pool:"
        guitext "  abbey, catch22, collide, croma6, disruption, enigma, forge"
        guitext "  haste, luna, pandora, redemption, reissen, rust, twinforts"
        guibutton "Echo" [echo "abbey, catch22, collide, croma6, disruption, enigma, forge, haste, luna, pandora, redemption, reissen, rust, twinforts"]
        guibutton "Say" [say "abbey, catch22, collide, croma6, disruption, enigma, forge, haste, luna, pandora, redemption, reissen, rust, twinforts"]
        guibar
            
        guitext "Effic Map Pool:"
        guitext "  aard3c, academy, frozen, haze, legazzo"
        guitext "  memento, ot, simplicity, turbine"
        guibutton "Echo" [echo "aard3c, academy, frozen, haze, legazzo, memento, ot, simplicity, turbine"]
        guibutton "Say" [say "aard3c, academy, frozen, haze, legazzo, memento, ot, simplicity, turbine"]
        guibar
            
        guitext "Insta Map Pool:"
        guitext "  aard3c, academy, carbide, complex, douze, duel7, duel8"
        guitext "  frozen, janela, kffa, memento, ot, souls, turbine"
        guibutton "Echo" [echo "aard3c, academy, carbide, complex, douze, duel7, duel8, frozen, janela, kffa, memento, ot, souls, turbine"]
        guibutton "Say" [say "aard3c, academy, carbide, complex, douze, duel7, duel8, frozen, janela, kffa, memento, ot, souls, turbine"]
        guibar
            
        guitext "FFA Map Pool:"
        guitext "  cartel, conflict, corruption, crypta, hades"
        guitext "  hator, headroom, metl2, metl3, metl4, nmp8"
        guitext "  purgatory, sauerowalk, toxicity, tumwalk, ztn(q)"
        guibutton "Echo" [echo "cartel, conflict, corruption, crypta, hades, hator, headroom, metl2, metl3, metl4, nmp8, purgatory, sauerowalk, toxicity, tumwalk, ztn(q)"]
        guibutton "Say" [say "cartel, conflict, corruption, crypta, hades, hator, headroom, metl2, metl3, metl4, nmp8, purgatory, sauerowalk, toxicity, tumwalk, ztn(q)"]
        guibar
            
        guibutton "Custom Maps" [showgui "Custom Duel Maps"]
        guibutton "Off Meta Pools" [showgui "Off-Meta Pools"]
        ]
    ]
]

